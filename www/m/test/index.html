<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Mocha Tests</title>
  <link href="../node_modules/mocha/mocha.css" rel="stylesheet" />
</head>
<body>
  <div id="mocha"></div>

  <script src="../node_modules/mocha/mocha.js"></script>
  <script type="module">
    import * as chai from '../node_modules/chai/index.js';
    import sinonChai from '../node_modules/sinon-chai/lib/sinon-chai.js';
    import sinon from '../node_modules/sinon/pkg/sinon-esm.js';
    import { InfiniteScrolling } from '../js/helpers/InfiniteScrolling.js';

    chai.use(sinonChai);
    window.sinon = sinon;
    window.Assert = chai.assert;
    window.sAssert = sinon.assert;
    window.expect = chai.expect;
    window.InfiniteScrolling = InfiniteScrolling;

    mocha.setup('bdd');
    await import('./test.test.js');
    mocha.checkLeaks();
    mocha.run();
  </script>
</body>
</html>
